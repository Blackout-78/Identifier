name: Build APK

# Builds the app on GitHub's computers after every push to main,
# then posts the APK under Releases so anyone can download it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Security guard (blocks the build if something dangerous was added)
        run: python3 .github/guard/guard.py
      - name: Check the Gradle wrapper is the official one
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Remove spaces, line breaks and a pasted label, which copying on Windows can add.
          printf '%s' "$KEYSTORE_BASE64" | sed 's/KEYSTORE_BASE64//g' | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Check the signing key and password
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          PW=$(printf '%s' "$SIGNING_STORE_PASSWORD" | tr -d ' \r\n\t')
          if ! keytool -list -keystore "$SIGNING_STORE_FILE" -storepass "$PW" > /dev/null 2>&1; then
            echo "::error::The key or KEYSTORE_PASSWORD secret doesn't match. Paste both again from github-secrets.txt."
            exit 1
          fi
          echo "SIGNING_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$(printf '%s' "${{ secrets.KEY_ALIAS }}" | tr -d ' \r\n\t')" >> "$GITHUB_ENV"

      - name: Run the tests (blocks the build if one fails)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Identifier-build-${{ github.run_number }}.apk"

      - name: Write what's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/release-notes.sh '^(build-|v[0-9])' . > release-body.md
          {
            echo
            echo 'Download **Identifier-build-${{ github.run_number }}.apk** below and open it on your Android phone.'
            echo 'Installs over earlier builds and keeps your settings.'
          } >> release-body.md

      - name: Post it under Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Identifier 1.0.${{ github.run_number }}
          body_path: release-body.md
          files: Identifier-build-${{ github.run_number }}.apk
          make_latest: true
